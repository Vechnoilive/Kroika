[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kroika-backend"
version = "0.16.0"
description = "FastAPI application with versioned sewing workflow and deterministic pattern generation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141,<0.142",
  "httpx2>=2.12,<2.13",
  "kroika-contracts==1.0.0",
  "kroika-pattern-engine==0.8.1",
  "Pillow>=12.3,<12.4",
  "uvicorn>=0.53,<0.54",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kroika_backend*"]
