[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kroika-pattern-engine"
version = "0.3.0"
description = "Deterministic geometry and experimental base-block engine for Kroika"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
include = ["kroika_pattern_engine*"]
