[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kroika-pattern-engine"
version = "0.12.0"
description = "Deterministic experimental garment generator with auditable pattern topology"
requires-python = ">=3.12"
dependencies = ["reportlab>=4.4,<4.5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kroika_pattern_engine*"]
