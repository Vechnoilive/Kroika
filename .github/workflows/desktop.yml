name: Kroika desktop integration

on:
  push:
    branches: [main, "codex/**"]
    paths:
      - "backend/**"
      - "src/**"
      - "pattern-engine/**"
      - "schemas/**"
      - "frontend/**"
      - "scripts/start_desktop.py"
      - "scripts/start_local.py"
      - "tests/test_desktop.py"
      - "tests/test_desktop_stage2.py"
      - "tests/test_desktop_stage3.py"
      - "tests/test_verify_support.py"
      - "requirements*.txt"
      - ".github/workflows/desktop.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install application and desktop dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-stage27.txt -r requirements-desktop.txt
          python -m pip install --no-deps -e . -e pattern-engine -e backend
      - name: Build the complete production interface
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Check desktop API, exports, persistence and process lifecycle
        run: python -m pytest -q tests/test_desktop.py tests/test_desktop_stage2.py tests/test_desktop_stage3.py tests/test_verify_support.py
      - name: Check desktop source
        run: python -m ruff check backend/src/kroika_backend/desktop.py backend/src/kroika_backend/desktop_bridge.py backend/src/kroika_backend/desktop_preferences.py backend/src/kroika_backend/desktop_data.py scripts/start_desktop.py tests/test_desktop.py tests/test_desktop_stage2.py
      - name: Check complete UI regression
        working-directory: frontend
        run: npm test
