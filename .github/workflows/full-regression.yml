name: Kroika full regression

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - codex/full-regression-12

permissions:
  contents: read

jobs:
  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-stage21.txt
          python -m pip install --no-deps -e . -e pattern-engine -e backend
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium for E2E
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run every automated gate from stages 2–21
        run: python scripts/verify_all.py
