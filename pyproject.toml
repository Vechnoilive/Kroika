[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kroika-contracts"
version = "1.0.0"
description = "Versioned data contracts and ports for the Kroika application"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.26,<5",
  "referencing>=0.36,<1",
]

[project.optional-dependencies]
test = [
  "openapi-spec-validator>=0.7.2,<0.8",
  "PyYAML>=6.0.3,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["kroika_contracts*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
