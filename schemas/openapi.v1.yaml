openapi: 3.1.0
info:
  title: Kroika API contracts
  version: 1.0.0
  description: >-
    Контракт будущего локального API. На этапе 3 обработчики ещё не реализованы;
    файл фиксирует границы модулей для этапа 4.
servers:
  - url: http://localhost:8000
    description: Локальный сервер
paths:
  /api/v1/garments/analyze-image:
    post:
      operationId: analyzeGarmentImages
      summary: Предложить признаки фасона по изображениям
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/ai-analysis-request.schema.json
      responses:
        '200':
          description: Строгое предложение AI, которое пользователь ещё должен подтвердить
          content:
            application/json:
              schema:
                $ref: ./v1/ai-style-analysis.schema.json
        '400':
          $ref: '#/components/responses/ContractError'
        '422':
          $ref: '#/components/responses/ContractError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v1/projects:
    post:
      operationId: createProject
      summary: Создать или импортировать проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/pattern-project.schema.json
      responses:
        '201':
          description: Проект сохранён
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Получить проект
      responses:
        '200':
          description: Проект найден
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceProject
      summary: Сохранить новую ревизию проекта
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Номер текущей ревизии для защиты от потерянного обновления
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/pattern-project.schema.json
      responses:
        '200':
          description: Новая ревизия сохранена
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '409':
          description: Проект уже изменён в другой вкладке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/patterns/generate:
    post:
      operationId: generatePattern
      summary: Запустить детерминированное построение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/pattern-engine-request.schema.json
      responses:
        '200':
          description: Существующий результат для того же input_hash или новый результат
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-engine-result.schema.json
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/patterns/{generation_id}/validation:
    get:
      operationId: getPatternValidation
      summary: Получить отчёт проверки
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Отчёт проверки
          content:
            application/json:
              schema:
                $ref: ./v1/validation-report.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/patterns/{generation_id}/preview.svg:
    get:
      operationId: getPatternPreview
      summary: Получить диагностический SVG из канонической геометрии
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: SVG-предпросмотр
          content:
            image/svg+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/patterns/{generation_id}/export/a4-pdf:
    post:
      operationId: exportPatternA4Pdf
      summary: Сформировать A4 PDF 1:1 после проверки политики экспорта
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Многостраничный PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '409':
          description: Экспорт заблокирован отчётом проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/patterns/{generation_id}/export/project-json:
    get:
      operationId: exportPatternProject
      summary: Скачать канонический JSON проекта
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Проект с версиями и контрольными суммами
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenerationId:
      name: generation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message_ru, issues, request_id]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        message_ru:
          type: string
          minLength: 1
          maxLength: 500
        issues:
          type: array
          items:
            $ref: ./v1/common.schema.json#/$defs/issue
        request_id:
          type: string
          format: uuid
  responses:
    ContractError:
      description: Вход не соответствует схеме или смысловым ограничениям
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: Выбранный AI-провайдер временно недоступен; ручной сценарий остаётся доступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
