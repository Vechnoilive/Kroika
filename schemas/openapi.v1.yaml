openapi: 3.1.0
info:
  title: Kroika API contracts
  version: 1.0.0
  description: >-
    Контракт локального API. На этапе 4 обработчики работают с SQLite,
    mock AI-провайдером и безопасным каркасом pattern-engine.
servers:
  - url: http://localhost:8000
    description: Локальный сервер
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Проверить, что процесс backend запущен
      responses:
        '200':
          description: Процесс отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      operationId: healthReady
      summary: Проверить SQLite и внутренние зависимости
      responses:
        '200':
          description: Приложение готово принимать запросы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v1/garments/analyze-image:
    post:
      operationId: analyzeGarmentImages
      summary: Предложить признаки фасона по изображениям
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/ai-analysis-request.schema.json
      responses:
        '200':
          description: Строгое предложение AI, которое пользователь ещё должен подтвердить
          content:
            application/json:
              schema:
                $ref: ./v1/ai-style-analysis.schema.json
        '400':
          $ref: '#/components/responses/ContractError'
        '422':
          $ref: '#/components/responses/ContractError'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: Показать недавние локальные проекты
      responses:
        '200':
          description: Список проектов без мерок и других чувствительных полей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
    post:
      operationId: createProject
      summary: Создать или импортировать проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/pattern-project.schema.json
      responses:
        '201':
          description: Проект сохранён
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Получить проект
      responses:
        '200':
          description: Проект найден
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceProject
      summary: Сохранить новую ревизию проекта
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Номер текущей ревизии для защиты от потерянного обновления
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/pattern-project.schema.json
      responses:
        '200':
          description: Новая ревизия сохранена
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '409':
          description: Проект уже изменён в другой вкладке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/patterns/generate:
    post:
      operationId: generatePattern
      summary: Запустить детерминированное построение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/pattern-engine-request.schema.json
      responses:
        '200':
          description: Существующий результат для того же input_hash или новый результат
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-engine-result.schema.json
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/patterns/{generation_id}/validation:
    get:
      operationId: getPatternValidation
      summary: Получить отчёт проверки
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Отчёт проверки
          content:
            application/json:
              schema:
                $ref: ./v1/validation-report.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/patterns/{generation_id}/preview.svg:
    get:
      operationId: getPatternPreview
      summary: Получить диагностический SVG из канонической геометрии
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: SVG-предпросмотр
          content:
            image/svg+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Геометрия ещё не создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '501':
          description: SVG-рендерер появится на следующем этапе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/patterns/{generation_id}/export/a4-pdf:
    post:
      operationId: exportPatternA4Pdf
      summary: Сформировать A4 PDF 1:1 после проверки политики экспорта
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Многостраничный PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '409':
          description: Экспорт заблокирован отчётом проверки
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '501':
          description: PDF-рендерер появится на этапе 9
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/patterns/{generation_id}/export/project-json:
    get:
      operationId: exportPatternProject
      summary: Скачать канонический JSON проекта
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Проект с версиями и контрольными суммами
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenerationId:
      name: generation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          minLength: 1
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, version, database, ai_provider, pattern_engine]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          minLength: 1
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        database:
          type: string
          const: ok
        ai_provider:
          type: string
          minLength: 1
        pattern_engine:
          type: string
          minLength: 1
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [project_id, name, revision, status, updated_at]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, inputs_confirmed, generated, validation_failed, ready_for_production_export]
        updated_at:
          type: string
          format: date-time
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message_ru, issues, request_id]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        message_ru:
          type: string
          minLength: 1
          maxLength: 500
        issues:
          type: array
          items:
            $ref: ./v1/common.schema.json#/$defs/issue
        request_id:
          type: string
          format: uuid
  responses:
    ContractError:
      description: Вход не соответствует схеме или смысловым ограничениям
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: Выбранный AI-провайдер временно недоступен; ручной сценарий остаётся доступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
