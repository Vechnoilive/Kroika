openapi: 3.1.0
info:
  title: Kroika API contracts
  version: 1.0.0
  description: >-
    Контракт API этапа 24. Проекты имеют ревизии, историю и явное удаление; подписанные
    виды изображений передаются модели в заданном порядке, а соединение с провайдером
    проверяется отдельным запросом без фотографий.
servers:
  - url: http://127.0.0.1:8000
    description: Локальный сервер
paths:
  /health/live:
    get:
      operationId: healthLive
      summary: Проверить, что процесс backend запущен
      responses:
        '200':
          description: Процесс отвечает
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /health/ready:
    get:
      operationId: healthReady
      summary: Проверить SQLite и внутренние зависимости
      responses:
        '200':
          description: Приложение готово принимать запросы
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v1/garments/analyze-image:
    post:
      operationId: analyzeGarmentImages
      summary: Предложить признаки фасона по изображениям
      parameters:
        - name: provider
          in: query
          required: false
          description: Явный выбор; без параметра используется серверный default
          schema:
            type: string
            enum: [mock, qwen, gemini]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/ai-analysis-request.schema.json
      responses:
        '200':
          description: Строгое предложение AI, которое пользователь ещё должен подтвердить
          content:
            application/json:
              schema:
                $ref: ./v1/ai-style-analysis.schema.json
        '400':
          $ref: '#/components/responses/ContractError'
        '422':
          $ref: '#/components/responses/ContractError'
        '429':
          $ref: '#/components/responses/ProviderUnavailable'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v1/garments/catalog:
    get:
      operationId: listGarmentCatalogue
      summary: Показать ограниченные варианты изделий и честный статус их приёмки
      responses:
        '200':
          description: Автоматические и физические статусы указаны отдельно
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GarmentCatalogue'
  /api/v1/release/status:
    get:
      operationId: getReleaseStatus
      summary: Показать единый fail-closed gate производственного выпуска
      responses:
        '200':
          description: Готовые и заблокированные изделия с незакрытыми физическими gates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseStatus'
  /api/v1/patterns/{generation_id}/physical-validation:
    parameters:
      - name: generation_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPhysicalValidation
      summary: Получить журнал физической проверки точной версии выкройки
      responses:
        '200':
          description: Последние статусы, вычисленный допуск и неизменяемая история
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalValidationSummary'
        '404':
          $ref: '#/components/responses/ContractError'
    post:
      operationId: recordPhysicalValidation
      summary: Добавить наблюдение печати, конструктора или макета
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PhysicalValidationCreate'
      responses:
        '201':
          description: Пересчитанный статус после добавления записи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PhysicalValidationSummary'
        '409':
          $ref: '#/components/responses/ContractError'
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/ai/providers:
    get:
      operationId: listAIProviders
      summary: Показать доступные способы анализа без проверки платного API
      responses:
        '200':
          description: Настройка и безопасная подсказка для каждого адаптера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProviderList'
  /api/v1/ai/providers/{provider_id}/check:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema: {type: string, enum: [mock, qwen, gemini]}
    post:
      operationId: checkAIProvider
      summary: Явно проверить ключ и соединение коротким запросом без фотографий
      responses:
        '200':
          description: Провайдер ответил на минимальный текстовый запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIProviderCheck'
        '402':
          $ref: '#/components/responses/ProviderUnavailable'
        '429':
          $ref: '#/components/responses/ProviderUnavailable'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
        '504':
          $ref: '#/components/responses/ProviderUnavailable'
  /api/v1/images:
    post:
      operationId: uploadGarmentImage
      summary: Сохранить проверенное изображение локально перед анализом
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageUploadRequest'
      responses:
        '201':
          description: Непрозрачная локальная ссылка; изображение перекодировано без исходных метаданных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageUploadResponse'
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/images/{image_ref}:
    parameters:
      - name: image_ref
        in: path
        required: true
        schema: {type: string, pattern: '^img_[a-f0-9]{32}$'}
    delete:
      operationId: deleteGarmentImage
      summary: Удалить неиспользуемое локальное изображение
      responses:
        '204': {description: Изображение удалено}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /api/v1/projects:
    get:
      operationId: listProjects
      summary: Показать недавние локальные проекты
      responses:
        '200':
          description: Список проектов без мерок и других чувствительных полей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
    post:
      operationId: createProject
      summary: Создать или импортировать проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/pattern-project.schema.json
      responses:
        '201':
          description: Проект сохранён
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Получить проект
      responses:
        '200':
          description: Проект найден
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceProject
      summary: Сохранить новую ревизию проекта
      parameters:
        - name: If-Match
          in: header
          required: true
          description: Номер текущей ревизии для защиты от потерянного обновления
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/pattern-project.schema.json
      responses:
        '200':
          description: Новая ревизия сохранена
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '409':
          description: Проект уже изменён в другой вкладке
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ContractError'
    delete:
      operationId: deleteProject
      summary: Удалить проект, его ревизии, построения и осиротевшие изображения
      responses:
        '204': {description: Локальные данные проекта удалены}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/projects/{project_id}/history:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProjectHistory
      summary: Получить сохранённые ревизии проекта без раскрытия их содержимого
      responses:
        '200':
          description: Новые версии расположены первыми
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectHistoryResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{project_id}/history/{revision}/restore:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - name: revision
        in: path
        required: true
        schema: {type: integer, minimum: 1}
      - name: If-Match
        in: header
        required: true
        schema: {type: integer, minimum: 1}
    post:
      operationId: restoreProjectRevision
      summary: Восстановить входы старой версии как новый безопасный черновик
      responses:
        '200':
          description: Создана новая ревизия; старые построения сохранены в истории
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/measurements/catalog:
    get:
      operationId: getMeasurementCatalog
      summary: Получить применимые мерки, диапазоны и инструкции
      parameters:
        - name: garment_type
          in: query
          schema:
            type: string
            default: dress
            enum: [dress, sundress, skirt, top, blouse, shirt, vest, jacket, trousers, shorts, jumpsuit]
        - name: sleeve_type
          in: query
          schema:
            type: string
            default: sleeveless
            enum: [sleeveless, short, long]
      responses:
        '200':
          description: Отфильтрованный каталог без персональных значений
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementCatalog'
  /api/v1/measurements/validate:
    post:
      operationId: validateMeasurements
      summary: Проверить полноту, диапазоны и согласованность мерок
      parameters:
        - name: garment_type
          in: query
          schema:
            type: string
            default: dress
            enum: [dress, sundress, skirt, top, blouse, shirt, vest, jacket, trousers, shorts]
        - name: sleeve_type
          in: query
          schema:
            type: string
            default: sleeveless
            enum: [sleeveless, short, long]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/body-measurements.schema.json
      responses:
        '200':
          description: Отчёт, не изменяющий и не дополняющий профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementValidation'
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/measurement-profiles:
    get:
      operationId: listMeasurementProfiles
      summary: Показать сохранённые профили без значений мерок
      responses:
        '200':
          description: Краткий список локальных профилей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementProfileList'
    post:
      operationId: createMeasurementProfile
      summary: Сохранить профиль по явному действию пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/body-measurements.schema.json
      responses:
        '201':
          description: Профиль сохранён локально
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementProfileRecord'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/measurement-profiles/{profile_id}:
    parameters:
      - $ref: '#/components/parameters/MeasurementProfileId'
    get:
      operationId: getMeasurementProfile
      summary: Получить сохранённый профиль
      responses:
        '200':
          description: Профиль найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementProfileRecord'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      operationId: replaceMeasurementProfile
      summary: Сохранить новую ревизию профиля
      parameters:
        - name: If-Match
          in: header
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/body-measurements.schema.json
      responses:
        '200':
          description: Новая ревизия профиля сохранена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeasurementProfileRecord'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ContractError'
    delete:
      operationId: deleteMeasurementProfile
      summary: Удалить сохранённый профиль мерок
      responses:
        '204': {description: Профиль мерок удалён}
        '404': {$ref: '#/components/responses/NotFound'}
  /api/v1/patterns/generate:
    post:
      operationId: generatePattern
      summary: Запустить детерминированное построение
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ./v1/pattern-engine-request.schema.json
      responses:
        '200':
          description: Существующий результат для того же input_hash или новый результат
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-engine-result.schema.json
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/patterns/{generation_id}/validation:
    get:
      operationId: getPatternValidation
      summary: Получить отчёт проверки
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Отчёт проверки
          content:
            application/json:
              schema:
                $ref: ./v1/validation-report.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/patterns/{generation_id}/preview.svg:
    get:
      operationId: getPatternPreview
      summary: Получить диагностический SVG из канонической геометрии
      parameters:
        - $ref: '#/components/parameters/GenerationId'
        - name: layers
          in: query
          required: false
          description: Нужные слои через запятую; без параметра возвращаются все
          schema:
            type: string
            example: cutting,seam,grain,labels,dimensions
      responses:
        '200':
          description: SVG-предпросмотр
          content:
            image/svg+xml:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Геометрия изделия недоступна
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ContractError'
  /api/v1/patterns/{generation_id}/export/print.svg:
    get:
      operationId: exportPatternPrintSvg
      summary: Скачать единый диагностический SVG 1:1 с линиями шва и среза
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Печатный SVG в миллиметрах
          content:
            image/svg+xml:
              schema:
                type: string
        '409':
          description: Диагностический экспорт заблокирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/patterns/{generation_id}/export/a4-pdf:
    post:
      operationId: exportPatternA4Pdf
      summary: Сформировать диагностический A4 PDF 1:1 для бумажной проверки
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Карта сборки и листы выкройки с предупреждением experimental
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '409':
          description: Диагностический экспорт заблокирован или макет некорректен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/patterns/{generation_id}/export/project-json:
    get:
      operationId: exportPatternProject
      summary: Скачать канонический JSON проекта
      parameters:
        - $ref: '#/components/parameters/GenerationId'
      responses:
        '200':
          description: Проект с версиями и контрольными суммами
          content:
            application/json:
              schema:
                $ref: ./v1/pattern-project.schema.json
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    ProjectId:
      name: project_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    GenerationId:
      name: generation_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MeasurementProfileId:
      name: profile_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status, service, version]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          minLength: 1
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, service, version, database, ai_provider, pattern_engine]
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          minLength: 1
        version:
          type: string
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
        database:
          type: string
          const: ok
        ai_provider:
          type: string
          minLength: 1
        pattern_engine:
          type: string
          minLength: 1
    AIProviderStatus:
      type: object
      additionalProperties: false
      required: [provider_id, name, model, configured, is_default, enabled_for_users, sends_images_external, message_ru]
      properties:
        provider_id: {type: string, enum: [mock, qwen, gemini]}
        name: {type: string, minLength: 1}
        model: {type: string, minLength: 1}
        configured: {type: boolean}
        is_default: {type: boolean}
        enabled_for_users: {type: boolean}
        sends_images_external: {type: boolean}
        message_ru: {type: string, minLength: 1}
    AIProviderList:
      type: object
      additionalProperties: false
      required: [default_provider, items]
      properties:
        default_provider: {type: string, enum: [mock, qwen, gemini]}
        items:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/AIProviderStatus'
    AIProviderCheck:
      type: object
      additionalProperties: false
      required: [provider_id, model, status, latency_ms, message_ru]
      properties:
        provider_id: {type: string, enum: [mock, qwen, gemini]}
        model: {type: string, minLength: 1}
        status: {type: string, const: ready}
        latency_ms: {type: integer, minimum: 0}
        message_ru: {type: string, minLength: 1}
    GarmentAcceptanceStatus:
      type: object
      additionalProperties: false
      required: [garment_type, name_ru, scope_ru, formula_status, reference_status, invariant_status, paper_status, expert_status, toile_status, production_allowed]
      properties:
        garment_type: {type: string, enum: [dress, sundress, skirt, top, blouse, shirt, vest, jacket, trousers, shorts]}
        name_ru: {type: string, minLength: 1}
        scope_ru: {type: string, minLength: 1}
        formula_status: {type: string, const: implemented}
        reference_status: {type: string, const: automated_passed}
        invariant_status: {type: string, const: automated_passed}
        paper_status: {type: string, enum: [pending, passed]}
        expert_status: {type: string, enum: [pending, passed]}
        toile_status: {type: string, enum: [pending, passed]}
        production_allowed: {type: boolean}
    GarmentCatalogue:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: '#/components/schemas/GarmentAcceptanceStatus'
    BlockedGarmentRelease:
      type: object
      additionalProperties: false
      required: [garment_type, missing_gates]
      properties:
        garment_type: {type: string, enum: [dress, sundress, skirt, top, blouse, shirt, vest, jacket, trousers, shorts]}
        missing_gates:
          type: array
          items: {type: string, enum: [paper, expert, toile]}
    ReleaseStatus:
      type: object
      additionalProperties: false
      required: [stage, status, production_ready, policy, ready_garments, blocked_garments]
      properties:
        stage: {type: integer, const: 15}
        status: {type: string, enum: [ready, blocked]}
        production_ready: {type: boolean}
        policy: {type: string, minLength: 1}
        ready_garments:
          type: array
          items: {type: string}
        blocked_garments:
          type: array
          items: {$ref: '#/components/schemas/BlockedGarmentRelease'}
    PhysicalValidationCreate:
      type: object
      additionalProperties: false
      required: [gate, reviewer_name]
      properties:
        gate: {type: string, enum: [paper, expert, toile]}
        outcome: {type: [string, 'null'], enum: [passed, failed, null]}
        reviewer_name: {type: string, minLength: 2, maxLength: 120}
        notes: {type: string, maxLength: 2000, default: ''}
        printer_name: {type: [string, 'null'], minLength: 2, maxLength: 120}
        square_width_mm: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 100}
        square_height_mm: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 100}
        control_line_mm: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 400}
        figure_label: {type: [string, 'null'], minLength: 2, maxLength: 120}
    PhysicalValidationRecord:
      type: object
      additionalProperties: false
      required: [record_id, project_id, generation_id, gate, outcome, reviewer_name, notes, printer_name, square_width_mm, square_height_mm, control_line_mm, figure_label, created_at]
      properties:
        record_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        generation_id: {type: string, format: uuid}
        gate: {type: string, enum: [paper, expert, toile]}
        outcome: {type: string, enum: [passed, failed]}
        reviewer_name: {type: string, minLength: 2, maxLength: 120}
        notes: {type: string, maxLength: 2000}
        printer_name: {type: [string, 'null'], minLength: 2, maxLength: 120}
        square_width_mm: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 100}
        square_height_mm: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 100}
        control_line_mm: {type: [number, 'null'], exclusiveMinimum: 0, maximum: 400}
        figure_label: {type: [string, 'null'], minLength: 2, maxLength: 120}
        created_at: {type: string, format: date-time}
    PhysicalGateStatus:
      type: object
      additionalProperties: false
      required: [gate, status, latest_record_id, checked_at, passed_observations, required_observations]
      properties:
        gate: {type: string, enum: [paper, expert, toile]}
        status: {type: string, enum: [pending, passed, failed]}
        latest_record_id: {type: [string, 'null'], format: uuid}
        checked_at: {type: [string, 'null'], format: date-time}
        passed_observations: {type: integer, minimum: 0}
        required_observations: {type: integer, minimum: 1}
    PhysicalValidationSummary:
      type: object
      additionalProperties: false
      required: [project_id, generation_id, gates, production_allowed, policy, records]
      properties:
        project_id: {type: string, format: uuid}
        generation_id: {type: string, format: uuid}
        gates:
          type: array
          minItems: 3
          maxItems: 3
          items: {$ref: '#/components/schemas/PhysicalGateStatus'}
        production_allowed: {type: boolean}
        policy: {type: string, minLength: 1}
        records:
          type: array
          items: {$ref: '#/components/schemas/PhysicalValidationRecord'}
    ImageUploadRequest:
      type: object
      additionalProperties: false
      required: [file_name, media_type, data_base64]
      properties:
        file_name: {type: string, minLength: 1, maxLength: 120}
        media_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        data_base64: {type: string, minLength: 4, maxLength: 28000000}
    ImageUploadResponse:
      type: object
      additionalProperties: false
      required: [image_ref, media_type, size_bytes]
      properties:
        image_ref: {type: string, pattern: '^img_[a-f0-9]{32}$'}
        media_type: {type: string, enum: [image/jpeg, image/png, image/webp]}
        size_bytes: {type: integer, minimum: 1}
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [project_id, name, revision, status, updated_at]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 120
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [draft, inputs_confirmed, generated, validation_failed, ready_for_production_export]
        updated_at:
          type: string
          format: date-time
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
    ProjectHistoryEntry:
      type: object
      additionalProperties: false
      required: [revision, status, updated_at, change_summary, is_current]
      properties:
        revision: {type: integer, minimum: 1}
        status: {type: string, minLength: 1}
        updated_at: {type: string, format: date-time}
        change_summary: {type: string, minLength: 1}
        is_current: {type: boolean}
    ProjectHistoryResponse:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProjectHistoryEntry'
    MeasurementDefinition:
      type: object
      additionalProperties: false
      required: [id, label_ru, group, kind, unit, minimum, maximum, instruction_ru, illustration, applicable_to, required_for, sleeve_only, required]
      properties:
        id: {type: string, pattern: '^[a-z][a-z0-9_]+$'}
        label_ru: {type: string, minLength: 1}
        group: {type: string, minLength: 1}
        kind: {type: string, enum: [linear, angle]}
        unit: {type: string, enum: [mm, deg]}
        minimum: {type: number}
        maximum: {type: number}
        instruction_ru: {type: string, minLength: 20}
        illustration: {type: string, minLength: 1}
        applicable_to:
          type: array
          items: {type: string}
        required_for:
          type: array
          items: {type: string}
        sleeve_only: {type: boolean}
        required: {type: boolean}
    MeasurementCatalog:
      type: object
      additionalProperties: false
      required: [schema_version, catalog_version, garment_type, sleeve_type, normalized_unit, display_units, source_options, measurements]
      properties:
        schema_version: {type: string, const: 1.0.0}
        catalog_version: {type: string, const: 1.0.0}
        garment_type: {type: string}
        sleeve_type: {type: string}
        normalized_unit: {type: string, const: mm}
        display_units:
          type: array
          prefixItems: [{const: cm}, {const: mm}]
          minItems: 2
          maxItems: 2
        source_options:
          type: array
          items: {type: string, enum: [user, preset, derived]}
        measurements:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementDefinition'
    MeasurementValidation:
      type: object
      additionalProperties: false
      required: [status, required_count, completed_count, issues]
      properties:
        status: {type: string, enum: [ready, incomplete, invalid]}
        required_count: {type: integer, minimum: 0}
        completed_count: {type: integer, minimum: 0}
        issues:
          type: array
          items:
            $ref: ./v1/common.schema.json#/$defs/issue
    MeasurementProfileSummary:
      type: object
      additionalProperties: false
      required: [profile_id, name, status, revision, updated_at]
      properties:
        profile_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 120}
        status: {type: string, enum: [draft, ready]}
        revision: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
    MeasurementProfileList:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MeasurementProfileSummary'
    MeasurementProfileRecord:
      type: object
      additionalProperties: false
      required: [revision, updated_at, profile]
      properties:
        revision: {type: integer, minimum: 1}
        updated_at: {type: string, format: date-time}
        profile:
          $ref: ./v1/body-measurements.schema.json
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [code, message_ru, issues, request_id]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{2,63}$'
        message_ru:
          type: string
          minLength: 1
          maxLength: 500
        issues:
          type: array
          items:
            $ref: ./v1/common.schema.json#/$defs/issue
        request_id:
          type: string
          format: uuid
  responses:
    ContractError:
      description: Вход не соответствует схеме или смысловым ограничениям
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ProviderUnavailable:
      description: Выбранный AI-провайдер временно недоступен; ручной сценарий остаётся доступен
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Объект не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Ресурс уже существует или был изменён в другой вкладке
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
