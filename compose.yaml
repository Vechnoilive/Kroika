name: kroika

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      KROIKA_DATABASE_PATH: /app/data/kroika.db
      KROIKA_IMAGE_STORAGE_PATH: /app/data/images
      KROIKA_AI_PROVIDER: ${KROIKA_AI_PROVIDER:-mock}
      KROIKA_ENABLED_AI_PROVIDERS: ${KROIKA_ENABLED_AI_PROVIDERS:-mock,qwen}
      KROIKA_AI_TIMEOUT_SECONDS: ${KROIKA_AI_TIMEOUT_SECONDS:-45}
      QWEN_API_KEY: ${QWEN_API_KEY:-}
      QWEN_BASE_URL: ${QWEN_BASE_URL:-}
      QWEN_MODEL: ${QWEN_MODEL:-qwen3-vl-plus}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_BASE_URL: ${GEMINI_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      KROIKA_LOG_LEVEL: INFO
      KROIKA_DEBUG: "false"
      KROIKA_CORS_ORIGINS: http://localhost:8080
    volumes:
      - kroika-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  kroika-data:
